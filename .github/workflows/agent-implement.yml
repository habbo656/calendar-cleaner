name: Agent – implement issue

# Autonomous loop: label an issue `agent:implement` → Claude implements it end-to-end,
# opens a PR labelled `automerge`, and the PR merges itself once CI + review pass.
on:
  issues:
    types: [labeled]

jobs:
  implement:
    if: github.event.label.name == 'agent:implement'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    concurrency:
      group: agent-issue-${{ github.event.issue.number }}
    permissions:
      contents: write
      pull-requests: write
      issues: write
      id-token: write
      actions: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci && npx playwright install --with-deps chromium
      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          track_progress: true
          prompt: |
            REPO: ${{ github.repository }}
            ISSUE: #${{ github.event.issue.number }}

            Implement this issue end-to-end by following the `implement-story` skill in
            .claude/skills/implement-story/SKILL.md exactly (non-interactive mode: never ask
            questions; make sensible decisions and record them in the PR description).
            Open the PR with `gh pr create --label automerge` and reference "Closes #${{ github.event.issue.number }}".
            If the issue is ambiguous or needs an owner decision, comment on the issue with
            concrete questions, add the label `needs-owner`, and stop without opening a PR.
          claude_args: |
            --max-turns 120
            --allowedTools "Bash(npm *),Bash(npx *),Bash(git *),Bash(gh pr *),Bash(gh issue *),Bash(gh label *),Edit,Write,Read,Glob,Grep"
