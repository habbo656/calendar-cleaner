name: Claude review

# Automatic AI code review on every PR. The `review` job is a required status check:
# it fails on REQUEST_CHANGES, so auto-merge waits until a new push gets APPROVE.
on:
  pull_request:
    types: [opened, synchronize, ready_for_review, reopened]

jobs:
  review:
    if: github.event.pull_request.draft == false && github.actor != 'dependabot[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      pull-requests: write
      issues: write
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 1
      - uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          track_progress: true
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            Review this PR following the checklist in .claude/agents/reviewer.md.
            Post inline comments for specific issues and one summary comment.
            End the summary with exactly one line: `VERDICT: APPROVE` or `VERDICT: REQUEST_CHANGES`.
            Use REQUEST_CHANGES only for must-fix problems (bugs, data-loss risk, security,
            missing tests for new logic), never for style nits.
            Finally write the single word APPROVE or REQUEST_CHANGES to the file review-verdict.txt
            in the repository root.
          claude_args: |
            --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*),Read,Glob,Grep,Write(review-verdict.txt)"
      - name: Enforce verdict
        run: |
          verdict=$(cat review-verdict.txt 2>/dev/null || echo MISSING)
          echo "Claude review verdict: $verdict"
          [ "$verdict" = "APPROVE" ]
